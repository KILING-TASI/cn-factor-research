[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cn-factor-research"
version = "0.1.0"
description = "可解释的量化因子、K线形态与CNN研究"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/**/*.txt", "licenses/**/*.md", "licenses/**/[Ll][Ii][Cc][Ee][Nn][Ss][Ee]*", "licenses/**/*.rst"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
cnn = ["torch>=2.6,<3"]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
cn-factor-research = "cn_factor_research.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/cn-factor-research" = ["README.md", "README.en.md", "SKILL.md", "CNN_RESEARCH.md", "PATTERN_RESEARCH.md", "MIGRATION.md", "MIGRATION_SOURCE.json", "CHANGELOG.md", "THIRD_PARTY_NOTICES.md", "SECURITY.md", "FACTOR_REVIEW.md", "catalog.json"]
"share/cn-factor-research/licenses" = ["licenses/dependency-license-snapshot.json"]
"share/cn-factor-research/examples/cnn-teaching" = ["examples/cnn-teaching/train.json", "examples/cnn-teaching/patterns.json", "examples/cnn-teaching/make_example.py", "examples/cnn-teaching/make_patterns.py", "examples/cnn-teaching/acceptance-record.json", "examples/cnn-teaching/pattern-acceptance-record.json"]
"share/cn-factor-research/examples/expansion-teaching" = ["examples/expansion-teaching/panel.json", "examples/expansion-teaching/trials.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
