name: Tests and independent installation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  base:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -I -S try_demo.py --out-dir reports/source-demo
      - run: python -m build
      - run: python tests/cnn_cold_acceptance.py --wheel dist/*.whl --out "${{ runner.temp }}/factor-base"
  cnn:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: >-
          python -m pip install "torch>=2.6,<3" --only-binary=:all:
          --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python tests/cnn_cold_acceptance.py --wheel dist/*.whl --out "${{ runner.temp }}/factor-cnn" --cnn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-cnn-${{ matrix.os }}
          path: ${{ runner.temp }}/factor-cnn/acceptance.json
          retention-days: 7
